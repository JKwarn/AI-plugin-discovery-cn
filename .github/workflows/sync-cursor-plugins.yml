name: Sync Cursor Plugins

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cursor-plugins-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this project
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone Cursor Plugins into temporary directory
        run: |
          git clone --depth 1 --branch main \
            https://github.com/cursor/plugins.git \
            "${RUNNER_TEMP}/cursor-plugins"

      - name: Synchronize source metadata
        run: |
          python scripts/sync/sync_cursor_plugins.py \
            --source-dir "${RUNNER_TEMP}/cursor-plugins" \
            --data-dir data

      - name: Create or update synchronization pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/cursor-plugins-sync
          delete-branch: true
          commit-message: "data: sync Cursor Plugins source metadata"
          title: "data: sync Cursor Plugins source metadata"
          body: |
            This pull request was generated by the manual Cursor Plugins synchronization workflow.

            It updates current Plugin and Skill metadata, preserves historical source snapshots,
            and records additions, modifications, and removals. It does not copy Skill documents,
            translate content, approve taxonomy assignments, or modify the upstream repository.
